<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norlyn Coffee — Moriva, capsules espresso premium en Algérie</title>
    <meta
      name="description"
      content="Moriva par Norlyn Coffee — capsules espresso 100 % bio en aluminium alimentaire pur. 4 intensités, 4 arômes, livraison 58 wilayas, paiement à la livraison."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Norlyn Coffee" />
    <meta property="og:title" content="Norlyn Coffee — Moriva, capsules espresso premium" />
    <meta
      property="og:description"
      content="Capsules espresso Moriva — 100 % bio, 0 % sucre, aluminium alimentaire pur. Livraison partout en Algérie, paiement à la livraison."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Moriva — capsules espresso premium par Norlyn Coffee" />
    <meta property="og:locale" content="fr_DZ" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Norlyn Coffee — Moriva, capsules espresso premium" />
    <meta
      name="twitter:description"
      content="Capsules espresso premium Moriva. Livraison 58 wilayas, paiement à la livraison."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Norlyn Coffee",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/images/norlyn-logo.webp",
        "description": "Capsules espresso premium Moriva par Norlyn Coffee. Livraison dans les 58 wilayas d'Algérie.",
        "areaServed": "Algérie",
        "paymentAccepted": "Cash on delivery"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Site face: Fraunces — a warm, high-contrast old-style serif with a true
      italic and an optical-size axis, so the SAME family reads as a display
      face in the hero and as a text face at 12px. Stand-in for Gourmand until
      the licensed files land in /public/fonts (see index.css).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Meta Pixel — go-live step: replace YOUR_PIXEL_ID in BOTH places below
      (script init + noscript img) with the client's real Pixel ID, or remove
      the whole block if no paid ads. src/lib/pixel.ts no-ops safely without it.
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', 'YOUR_PIXEL_ID');
      fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=PageView&noscript=1"
    /></noscript>
    -->
  </head>
  <body>
    <!--
      Everything below is what the visitor sees BEFORE React exists, and it is
      here because the alternative is a pure white screen. `#root` is empty
      until the bundle downloads, parses and mounts; on a phone on mobile data
      inside an in-app browser (Instagram, Facebook) that is seconds, and if
      the bundle never arrives at all it is forever. A white screen tells the
      visitor the site is broken and they leave — a mark and a line of copy
      tell them it is coming.

      React's createRoot() clears the container on mount, so none of this needs
      removing by hand and none of it can survive into the running app.
    -->
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1.25rem;
          background: rgb(252 248 242);
          color: rgb(43 29 22);
          font-family: Georgia, 'Times New Roman', serif;
          text-align: center;
          padding: 1.5rem;
        "
      >
        <!-- the wordmark ships on an opaque white square; multiply drops that
             square into the cream without needing a cut-out -->
        <img
          src="/images/logo/moriva-dark-lg.webp"
          alt="Moriva"
          width="132"
          height="132"
          style="width: 132px; height: auto; mix-blend-mode: multiply"
        />
        <p style="margin: 0; font-size: 0.9rem; letter-spacing: 0.08em; color: rgb(169 124 55)">
          Chargement…
        </p>
      </div>
    </div>

    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          z-index: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgb(252 248 242);
          color: rgb(43 29 22);
          font-family: Georgia, 'Times New Roman', serif;
          text-align: center;
          padding: 2rem;
        "
      >
        <p style="max-width: 32rem; line-height: 1.7">
          Cette boutique a besoin de JavaScript pour fonctionner. Activez-le dans votre navigateur,
          ou commandez directement par téléphone.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
