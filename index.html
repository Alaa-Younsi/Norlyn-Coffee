<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!--
      Generated from assets-src/favicon.png by scripts/generate-favicons.mjs —
      regenerate there rather than editing these by hand. The browser picks the
      closest size, so the 16 is a real 16 (a downscaled 32 blurs the N).
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norlyn Coffee — Moriva, capsules espresso premium en Algérie</title>
    <meta
      name="description"
      content="Moriva par Norlyn Coffee — capsules espresso 100 % bio en aluminium alimentaire pur. 4 intensités, 4 arômes, livraison 69 wilayas, paiement à la livraison."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Norlyn Coffee" />
    <meta property="og:title" content="Norlyn Coffee — Moriva, capsules espresso premium" />
    <meta
      property="og:description"
      content="Capsules espresso Moriva — 100 % bio, 0 % sucre, aluminium alimentaire pur. Livraison partout en Algérie, paiement à la livraison."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Moriva — capsules espresso premium par Norlyn Coffee" />
    <meta property="og:locale" content="fr_DZ" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Norlyn Coffee — Moriva, capsules espresso premium" />
    <meta
      name="twitter:description"
      content="Capsules espresso premium Moriva. Livraison 69 wilayas, paiement à la livraison."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Norlyn Coffee",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/images/norlyn-logo.webp",
        "description": "Capsules espresso premium Moriva par Norlyn Coffee. Livraison dans les 69 wilayas d'Algérie.",
        "areaServed": "Algérie",
        "paymentAccepted": "Cash on delivery"
      }
    </script>

    <!--
      The two things that must happen before the browser's first paint. Both
      were tried from inside the bundle and both were too late by then — a
      module script does not execute until it and its whole import graph have
      downloaded, and the browser has drawn a frame long before that.

      1. THEME. <ThemeProvider> reads the same key, but can only write
         `data-theme` from an effect — one full paint after the document was
         drawn in whatever theme the attribute above says. For a visitor who
         chose dark that paint is a full-screen flash of cream, landing on the
         splash screen, the very first thing they see.

      1b. LANGUAGE / DIRECTION. Same story for a returning Arabic visitor:
         <html lang="fr"> is hardcoded and <LanguageProvider> only fixes
         `lang`/`dir` from an effect, so the first paint is LTR and then snaps
         to RTL. Read the same `norlyn-lang` key here.

      2. SCROLL RESTORATION. Reload a page you had scrolled and the browser
         puts you back where you were. That is right for a document and wrong
         for this landing, whose every act is keyed to an absolute offset
         measured after the page settles: restoring to 3200 px means the
         choreography starts mid-act, at a position measured against the
         PREVIOUS layout. Measured from the bundle it was ~440 ms late — long
         enough for the page to be drawn scrolled, and only undone when the
         splash's overflow lock happened to collapse the page a frame later.
         Here it lands before there is anything to restore.

      Kept in sync with theme/ThemeProvider.tsx and lib/lenis.ts. NOTE: this
      script is allowed by a sha256 in the CSP (vercel.json) — editing it means
      recomputing that hash, or it stops running. See docs/ARCHITECTURE.md.
    -->
    <script>
      try {
        var d = document.documentElement;
        var t = localStorage.getItem("norlyn-theme");
        if (t === "dark" || t === "light") d.dataset.theme = t;
        var l = localStorage.getItem("norlyn-lang");
        if (l === "fr" || l === "ar" || l === "en") {
          d.lang = l;
          d.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {
        /* private mode — the light/fr defaults in the markup above stand */
      }
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    </script>

    <!-- the mark that covers the loading must never itself be a thing that is
         loading: it is the boot screen's only image and both the pre-React
         shell and <SplashScreen> draw it -->
    <link rel="preload" as="image" href="/images/norlyn-logo.webp" fetchpriority="high" />

    <!--
      Site face: Fraunces — a warm, high-contrast old-style serif with a true
      italic and an optical-size axis, so the SAME family reads as a display
      face in the hero and as a text face at 12px. Stand-in for Gourmand until
      the licensed files land in /public/fonts (see index.css).

      Self-hosted via @fontsource and imported from src/main.tsx — no Google
      Fonts <link> (render-blocking, third-party) and nothing to allow-list in
      the CSP. The woff2 files ship from /assets on our own origin.
    -->

    <!--
      The boot screen's own styles, inline and self-contained.

      They cannot come from the bundle's stylesheet: in dev that sheet is
      injected by JavaScript, which is precisely what has not run yet, so the
      shell below would paint unstyled — a giant raw wordmark on white — every
      single time the developer loads the page. Inline is also one fewer thing
      that has to arrive before the first meaningful paint in production.

      The values are the light and dark `--c-bg` / `--c-line` / `--c-brand`
      from src/index.css, written out because that file is not here yet.
    -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        padding: 1.5rem;
        background: rgb(243 236 226);
      }
      .boot-halo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 70vmin;
        height: 70vmin;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        opacity: 0.7;
        filter: blur(64px);
        background: radial-gradient(
          circle,
          rgba(214, 178, 112, 0.3),
          rgba(169, 124, 55, 0.1) 45%,
          transparent 70%
        );
      }
      .boot-mark {
        position: relative;
        width: 190px;
        max-width: 62vw;
        height: auto;
      }
      .boot-rail {
        position: relative;
        width: 10rem;
        max-width: 52vw;
        height: 1px;
        overflow: hidden;
        border-radius: 9999px;
        background: rgb(215 202 182);
      }
      .boot-fill {
        display: block;
        height: 100%;
        width: 8%;
        background: rgb(169 124 55);
        /* Creeps to the same 82% <SplashScreen>'s rail parks at, so the two
           rails line up at the handoff instead of the bar jumping backwards. */
        animation: boot-fill 1.6s cubic-bezier(0, 0, 0.2, 1) forwards;
      }
      @keyframes boot-fill {
        to {
          width: 82%;
        }
      }
      html[data-theme="dark"] .boot {
        background: rgb(19 14 10);
      }
      html[data-theme="dark"] .boot-rail {
        background: rgb(62 48 37);
      }
      html[data-theme="dark"] .boot-fill {
        background: rgb(201 162 75);
      }
      /* the wordmark is dark ink on transparent — the same inversion
         .norlyn-logo gets in src/index.css */
      html[data-theme="dark"] .boot-mark {
        filter: invert(0.92) hue-rotate(180deg) saturate(1.15);
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-fill {
          animation: none;
          width: 82%;
        }
      }
    </style>

    <!--
      Meta Pixel — go-live step: replace YOUR_PIXEL_ID in BOTH places below
      (script init + noscript img) with the client's real Pixel ID, or remove
      the whole block if no paid ads. src/lib/pixel.ts no-ops safely without it.
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', 'YOUR_PIXEL_ID');
      fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=PageView&noscript=1"
    /></noscript>
    -->
  </head>
  <body>
    <!--
      Everything below is what the visitor sees BEFORE React exists, and it is
      here because the alternative is a pure white screen. `#root` is empty
      until the bundle downloads, parses and mounts; on a phone on mobile data
      inside an in-app browser (Instagram, Facebook) that is seconds, and if
      the bundle never arrives at all it is forever. A white screen tells the
      visitor the site is broken and they leave — a mark tells them it is
      coming.

      It is drawn to match <SplashScreen> pixel for pixel — same mark, same
      size, same rail, same background — because React's createRoot() clears
      this container the instant it mounts and paints the component over it.
      Any difference between the two would show up as a flicker at exactly the
      moment the site is trying to look composed. Change one, change the other.

      React's createRoot() clears the container on mount, so none of this needs
      removing by hand and none of it can survive into the running app.
    -->
    <div id="root">
      <div class="boot">
        <div class="boot-halo"></div>
        <img class="boot-mark" src="/images/norlyn-logo.webp" alt="Norlyn Coffee" width="640" height="237" />
        <div class="boot-rail"><span class="boot-fill"></span></div>
      </div>
    </div>

    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          z-index: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgb(252 248 242);
          color: rgb(43 29 22);
          font-family: Georgia, 'Times New Roman', serif;
          text-align: center;
          padding: 2rem;
        "
      >
        <p style="max-width: 32rem; line-height: 1.7">
          Cette boutique a besoin de JavaScript pour fonctionner. Activez-le dans votre navigateur,
          ou commandez directement par téléphone.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
